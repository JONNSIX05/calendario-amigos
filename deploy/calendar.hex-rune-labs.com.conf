# =====================================================================
# Configuración de proxy inverso en Nginx para calendar.hex-rune-labs.com
# Ubicación en VPS: /etc/nginx/sites-available/calendar.hex-rune-labs.com
# Enlace simbólico: sudo ln -s /etc/nginx/sites-available/calendar.hex-rune-labs.com /etc/nginx/sites-enabled/
# Certificado SSL:  Let's Encrypt gestionado automáticamente por Certbot
# =====================================================================

limit_req_zone $binary_remote_addr zone=cal_auth_limit:10m rate=10r/m;

server {
    server_name calendar.hex-rune-labs.com;

    # Ocultar versión de Nginx
    server_tokens off;

    # Límite máximo de payload (los íconos tienen máximo 512 KB)
    client_max_body_size 1M;

    # Timeouts anti-Slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # Rate limit estricto en endpoints de autenticación e invitaciones
    location /api/auth/ {
        limit_req zone=cal_auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Resto de endpoints de la API y Frontend SPA
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/calendar.hex-rune-labs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/calendar.hex-rune-labs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = calendar.hex-rune-labs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name calendar.hex-rune-labs.com;
    return 404; # managed by Certbot
}
